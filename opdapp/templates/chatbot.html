{% extends 'base.html' %}
{% load static %}

{% block content %}

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

.chat-wrapper{
    display:flex;
    justify-content:center;
    padding:40px 20px;
}

.chat-card{
    width:850px;
    min-height:450px;
    background:white;
    border-radius:24px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    display:flex;
    flex-direction:column;
}

.chat-header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:20px;
}

.chat-icon{
    width:58px;
    height:58px;
    border-radius:16px;
    background:#eef5ff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.chat-icon i{
    color:#1e4fd8;
    font-size:28px;
}

.chat-title h2{
    margin:0;
    color:#1e4fd8;
    font-size:30px;
    font-weight:700;
}

.chat-title p{
    margin:4px 0 0;
    color:#666;
    font-size:14px;
}

#chat-box{
    flex:1;
    min-height:250px;
    overflow-y:auto;
    background:#f8fbff;
    border:1px solid #e5edf8;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
}

.user-message{
    background:#2563eb;
    color:white;
    padding:12px 18px;
    border-radius:18px 18px 4px 18px;
    margin-left:auto;
    margin-bottom:14px;
    max-width:50%;
    display:inline-block;
    text-align:left;
    word-wrap:break-word;
}

.bot-message{
    background:white;
    border:1px solid #e5e7eb;
    padding:14px 18px;
    border-radius:18px 18px 18px 4px;
    margin-bottom:20px;
    max-width:85%;
    word-wrap:break-word;
}

.input-area{
    display:flex;
    gap:12px;
}

.input-area input{
    flex:1;
    border:1px solid #dbe4f3;
    border-radius:14px;
    padding:14px 16px;
    font-size:14px;
    outline:none;
    background:#f8fbff;
    transition:.3s;
}

.input-area input:focus{
    border-color:#1e4fd8;
    background:white;
    box-shadow:0 0 0 4px rgba(30,79,216,.08);
}

.input-area button{
    border:none;
    background:#1e4fd8;
    color:white;
    padding:0 24px;
    border-radius:14px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:8px;
}

.input-area button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(30,79,216,.2);
}

.user-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
}

.bot-row{
    display:flex;
    justify-content:flex-start;
    margin-bottom:18px;
}

</style>

<div class="chat-wrapper">

    <div class="chat-card">

        <div class="chat-header">

            <div class="chat-icon">
                <i class="bi bi-robot"></i>
            </div>

            <div class="chat-title">

                <h2 style="
                font-family:'poppins';
              ">OPD Assistant</h2>

                <p>
                    Ask about symptoms, doctors and appointments
                </p>

            </div>

        </div>

        <div id="chat-box">

           <div class="bot-message" 
                id="welcome-message">

                <b>
    <i class="bi bi-heart-pulse-fill"
       style="color:#1e4fd8;">
    </i>

    OPD Assistant
</b>

<br><br>

Welcome

<br><br>

I'm ready to help with appointments,doctor recommendations,<br>
symptom guidance,and hospital information.

            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Ask your question..."
            >

            <button onclick="sendMessage()">

                <i class="bi bi-send-fill"></i>

                Send

            </button>

        </div>

    </div>

</div>

<script>

function sendMessage(){

    const chatBox =
        document.getElementById("chat-box");

    const welcomeMessage =
        document.getElementById("welcome-message");

    if(welcomeMessage){
        welcomeMessage.remove();
    }

    let message =
        document.getElementById("message").value;

    if(message.trim() === ""){
        return;
    }

    const lat = localStorage.getItem("lat");
    const lon = localStorage.getItem("lon");

    fetch(
    `/chatbot-api/?message=${encodeURIComponent(message)}&lat=${lat}&lon=${lon}`
)

    .then(response => response.json())
    
    .then(data => {

    chatBox.innerHTML += `
    <div class="user-row">
        <div class="user-message">
            ${message}
        </div>
    </div>

    <div class="bot-row">
        <div class="bot-message">
            ${data.reply}
        </div>
    </div>
    `;

    document.getElementById("message").value = "";

    chatBox.scrollTop =
        chatBox.scrollHeight;

});
}

document.getElementById("message")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

    }

});

</script>

{% endblock %}
