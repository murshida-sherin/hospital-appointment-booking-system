{% block content %}

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');

.login-wrapper{

    min-height:85vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

    font-family:'Manrope',sans-serif;

}

.login-card{

    width:100%;

    max-width:420px;

    background:white;

    border-radius:24px;

    padding:34px;

    box-shadow:0 10px 35px rgba(0,0,0,.08);

}

.login-top{

    text-align:center;

    margin-bottom:28px;

}

.login-icon{

    width:75px;

    height:75px;

    margin:auto;

    margin-bottom:18px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#e8f1ff;

}

.login-icon i{

    font-size:32px;

    color:#0d6efd;

}

.login-top h2{

    font-size:28px;

    color:#0f172a;

    margin-bottom:8px;

}

.login-top p{

    color:#64748b;

    font-size:14px;

    line-height:1.5;

}

.form-group{

    margin-bottom:20px;

}

.form-group label{

    display:block;

    margin-bottom:10px;

    font-size:14px;

    font-weight:600;

    color:#1e293b;

}

.input-box{

    position:relative;

}

.input-box i{

    position:absolute;

    left:15px;

    top:50%;

    transform:translateY(-50%);

    color:#64748b;

    font-size:15px;

}

.input-box input{

    width:100%;

    padding:13px 14px 13px 42px;

    border:1px solid #dbe2ea;

    border-radius:12px;

    background:#f8fafc;

    font-size:14px;

    transition:.3s;

    box-sizing:border-box;

}

.input-box input:focus{

    outline:none;

    background:white;

    border-color:#0d6efd;

    box-shadow:0 0 0 4px rgba(13,110,253,.08);

}

.login-btn{

    width:100%;

    border:none;

    border-radius:12px;

    padding:13px;

    margin-top:6px;

    background:linear-gradient(135deg,#0d6efd,#2563eb);

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 20px rgba(37,99,235,.22);

}

.alert-box{

    background:#fee2e2;

    color:#dc2626;

    padding:14px;

    border-radius:12px;

    margin-bottom:20px;

    text-align:center;

    font-size:14px;

    font-weight:600;

}

.doctor-note{

    margin-top:22px;

    text-align:center;

    font-size:13px;

    color:#64748b;

}

.doctor-note i{

    color:#0d6efd;

    margin-right:6px;

}

</style>

<div class="login-wrapper">

<div class="login-card">

<div class="login-top">

<div class="login-icon">

<i class="bi bi-person-badge"></i>

</div>

<h2>Doctor Portal</h2>

<p>

Sign in to access today's appointments, notifications and your profile.

</p>

</div>

{% if messages %}

{% for message in messages %}

<div class="alert-box">

{{ message }}

</div>

{% endfor %}

{% endif %}

<form method="POST">

{% csrf_token %}

<div class="form-group">

<label>Username</label>

<div class="input-box">

<i class="bi bi-person"></i>

<input
type="text"
name="username"
placeholder="Enter username"
required>

</div>

</div>

<div class="form-group">

<label>Password</label>

<div class="input-box">

<i class="bi bi-lock"></i>

<input
type="password"
name="password"
placeholder="Enter password"
required>

</div>

</div>

<button
type="submit"
class="login-btn">

Login to Doctor Portal

</button>

</form>

<div class="doctor-note">

<i class="bi bi-heart-pulse-fill"></i>

Authorized doctors only.

</div>

</div>

</div>

{% endblock %}
