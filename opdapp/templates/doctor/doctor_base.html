<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>{% block title %}Doctor Portal{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Manrope',sans-serif;
}

body{
    background:#f4f7fc;
}

/* Sidebar */

.sidebar{

    position:fixed;

    left:0;

    top:0;

    width:220px;

    height:100vh;

    background:linear-gradient(180deg,#0d6efd,#2563eb);

    color:white;

    padding:20px;

}

/* Logo */

.sidebar h3{

    display:flex;

    align-items:center;

    gap:12px;

    font-size:24px;

    font-weight:700;

    margin-bottom:40px;

}

.sidebar h3 i{

    font-size:28px;

}

/* Menu */

.sidebar a{

    display:flex;

    align-items:center;

    gap:12px;

    text-decoration:none;

    color:white;

    padding:12px 14px;

    border-radius:12px;

    margin-bottom:8px;

    transition:.3s;

    font-size:15px;

    font-weight:500;

}

.sidebar a:hover{

    background:rgba(255,255,255,.18);

}

.sidebar a.active{

    background:white;

    color:#0d6efd;

    font-weight:600;

}

.sidebar a.active i{

    color:#0d6efd;

}

/* Main */

.main{

    margin-left:200px;

    padding:20px;

}

/* Topbar */

.topbar{

    background:white;

    border-radius:18px;

    padding:16px 24px;

    margin-bottom:28px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 5px 18px rgba(0,0,0,.06);

}

/* Left */

.topbar-left h4{

    font-size:24px;

    font-weight:600;

    color:#0f172a;

}

.topbar-left p{

    margin-top:4px;

    color:#64748b;

    font-size:14px;

}

/* Right */

.topbar-right{

    display:flex;

    align-items:center;

    gap:12px;

}

.topbar-right img{

    width:50px;

    height:50px;

    border-radius:50%;

    object-fit:cover;

    border:3px solid #e8f1ff;

}

.avatar{

    width:50px;

    height:50px;

    border-radius:50%;

    background:#e8f1ff;

    display:flex;

    justify-content:center;

    align-items:center;

}

.avatar i{

    color:#0d6efd;

    font-size:24px;

}

.doctor-info{

    text-align:right;

}

.doctor-info strong{

    display:block;

    color:#0f172a;

}

.doctor-info span{

    font-size:13px;

    color:#64748b;

}

.card{

    background:white;

    border:none;

    border-radius:20px;

    box-shadow:0 5px 18px rgba(0,0,0,.06);

}

</style>

{% block extra_css %}
{% endblock %}

</head>

<body>

<div class="sidebar">

<h3>

<i class="bi bi-heart-pulse-fill"></i>

Smart OPD

</h3>

<a href="{% url 'doctor_dashboard' %}"
class="{% block dashboard_active %}{% endblock %}">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

<a href="{% url 'doctor_profile' %}"
class="{% block profile_active %}{% endblock %}">

<i class="bi bi-person-badge"></i>

My Profile

</a>

<a href="{% url 'doctor_logout' %}">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

</div>

<div class="main">


{% block content %}
{% endblock %}

</div>

{% block extra_js %}
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
