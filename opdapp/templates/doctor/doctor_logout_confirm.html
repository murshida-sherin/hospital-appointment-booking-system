<!DOCTYPE html>
<html>
<head>

    <title>Logout</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Manrope',sans-serif;
            background:#f4f7fc;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .logout-container{
            width:100%;
            max-width:450px;
            background:white;
            padding:45px;
            border-radius:28px;
            text-align:center;
            box-shadow:0 10px 35px rgba(0,0,0,0.08);
        }

        .logout-icon{
            width:90px;
            height:90px;
            background:#e8f1ff;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            margin-bottom:25px;
        }

        .logout-icon i{
            font-size:42px;
            color:#0d6efd;
        }

        h1{
            font-size:32px;
            margin-bottom:12px;
            color:#0f172a;
        }

        p{
            color:#64748b;
            font-size:16px;
            line-height:1.6;
            margin-bottom:35px;
        }

        .button-group{
            display:flex;
            justify-content:center;
            gap:16px;
        }

        .btn{
            padding:13px 24px;
            border:none;
            border-radius:12px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
            text-decoration:none;
            display:inline-flex;
            align-items:center;
            gap:8px;
            color:white;
        }

        .btn-primary{
            background:linear-gradient(135deg,#0d6efd,#2563eb);
        }

        .btn-primary:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 18px rgba(37,99,235,0.25);
        }

        .btn-danger{
            background:linear-gradient(135deg,#ef4444,#dc2626);
        }

        .btn-danger:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 18px rgba(220,38,38,0.25);
        }

    </style>

</head>

<body>

<div class="logout-container">

    <div class="logout-icon">
        <i class="bi bi-box-arrow-right"></i>
    </div>

    <h1>Logout</h1>

    <p>
        You will be signed out of your account.
        Are you sure you want to continue?
    </p>

    <div class="button-group">

        <form method="POST" action="{% url 'logout_confirm' %}">
    {% csrf_token %}

    <button type="submit"
            class="btn btn-danger">

        <i class="bi bi-box-arrow-right"></i>
        Yes, Logout

    </button>

</form>

        <a href="/"
           class="btn btn-primary">

            <i class="bi bi-arrow-left"></i>
            Cancel

        </a>

    </div>

</div>

</body>
</html>
