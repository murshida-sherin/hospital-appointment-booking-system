{% extends 'base.html' %}
{% load static %}

{% block content %}

<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
">

    <div style="
        width:420px;
        background:white;
        border-radius:24px;
        padding:40px 35px;
        box-shadow:0 10px 30px rgba(0,0,0,0.08);
        text-align:center;
    ">

        <!-- PROFILE ICON -->

        <div style="
            width:100px;
            height:100px;
            margin:auto;
            border-radius:50%;
            background:#eef5ff;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:20px;
        ">

            <img 
                src="{% static 'images/profile2.png' %}"

                style="
                    width:65px;
                    height:65px;
                    object-fit:contain;
                "
            >

        </div>

        <!-- TITLE -->

        <h2 style="
            color:#1e4fd8;
            margin-bottom:30px;
            font-size:30px;
            font-weight:700;
        ">
            Edit Profile
        </h2>

        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <!-- USERNAME -->

            <div style="text-align:left; margin-bottom:18px;">

                <label style="
                    font-weight:600;
                    color:#444;
                    display:block;
                    margin-bottom:8px;
                ">
                    Username
                </label>

                <input 
                    type="text" 
                    name="username" 
                    value="{{ user.username }}" 
                    placeholder="Username"

                    style="
                        width:100%;
                        padding:14px;
                        border-radius:12px;
                        border:1px solid #dbe4f3;
                        font-size:15px;
                        outline:none;
                        box-sizing:border-box;
                    "
                >

            </div>

            <!-- PHONE -->

            <div style="text-align:left; margin-bottom:30px;">

                <label style="
                    font-weight:600;
                    color:#444;
                    display:block;
                    margin-bottom:8px;
                ">
                    Phone Number
                </label>

                <input 
                    type="text" 
                    name="phone" 
                    value="{{ profile.phone }}" 
                    placeholder="Phone Number"

                    style="
                        width:100%;
                        padding:14px;
                        border-radius:12px;
                        border:1px solid #dbe4f3;
                        font-size:15px;
                        outline:none;
                        box-sizing:border-box;
                    "
                >

            </div>

            <!-- BUTTONS -->

            <div style="
                display:flex;
                gap:14px;
                justify-content:center;
            ">

                <!-- SAVE -->

                <button type="submit"

                    style="
                        flex:1;
                        padding:14px;
                        background:#1e4fd8;
                        color:white;
                        border:none;
                        border-radius:12px;
                        font-size:15px;
                        font-weight:600;
                        cursor:pointer;
                    "
                >
                    Save Changes
                </button>

                <!-- CANCEL -->

                <a href="/profile/"
                   style="
                    flex:1;
                    text-decoration:none;
                   ">

                    <button type="button"

                        style="
                            width:100%;
                            padding:14px;
                            background:white;
                            color:#e63946;
                            border:2px solid #e63946;
                            border-radius:12px;
                            font-size:15px;
                            font-weight:600;
                            cursor:pointer;
                        "
                    >
                        Cancel
                    </button>

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
