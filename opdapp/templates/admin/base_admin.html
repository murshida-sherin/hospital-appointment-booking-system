<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>{% block title %}Admin Panel{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Manrope', sans-serif;
    font-size:14px;
}

body{

    background:#f4f7fc;

}

.sidebar{

    position:fixed;

    left:0;

    top:0;

    width:220px;

    height:100vh;

    background:linear-gradient(180deg,#0d6efd,#2563eb);

    color:white;

    padding:18px;

}

.sidebar h3{

    display:flex;

    align-items:center;

    gap:12px;

    color:white;

    font-size:22px;

    font-weight:700;

    margin-bottom:35px;
    white-space:nowrap;
}

.sidebar h3 i{

    font-size:24px;

}

.sidebar a{

    display:block;

    color:white;

    text-decoration:none;

    padding:9px 12px;

    border-radius:12px;

    margin-bottom:8px;

    transition:.3s;
    font-size:14px;

}

.sidebar a:hover{

    background:rgba(255,255,255,.18);

}

.sidebar a.active{

    background:white;

    color:#0d6efd;

    font-weight:600;

}

.sidebar a.active i{

    color:#0d6efd;

}

.sidebar a{

    display:flex;

    align-items:center;

    gap:10px;

    color:white;

    text-decoration:none;

    padding:8px 12px;

    border-radius:12px;

    margin-bottom:6px;

    transition:.3s;

    font-size:15px;

    font-weight:500;

    line-height:1.2;

}

.sidebar a i{

    font-size:18px;

    min-width:20px;

    text-align:center;

}

.main{

    margin-left:210px;

    padding:18px;

}

.topbar{

    background:white;

    border-radius:18px;

    padding:16px;

    margin-bottom:30px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

}

</style>

{% block extra_css %}

{% endblock %}

</head>

<body>

<div class="sidebar">

<h3>

<i class="bi bi-hospital"></i>

Smart OPD

</h3>

<a href="{% url 'admin_dashboard' %}"
class="{% block dashboard_active %}{% endblock %}">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="{% url 'appointment_management' %}"
class="{% block appointment_active %}{% endblock %}">
<i class="bi bi-journal-medical"></i>
Appointments
</a>

<a href="{% url 'hospital_management' %}"
class="{% block hospital_active %}{% endblock %}">
<i class="bi bi-building"></i>
Hospitals
</a>

<a href="{% url 'department_management' %}"
class="{% block department_active %}{% endblock %}">
<i class="bi bi-diagram-3"></i>
Departments
</a>

<a href="{% url 'doctor_management' %}"
class="{% block doctor_active %}{% endblock %}">
<i class="bi bi-person-badge"></i>
Doctors
</a>

<a href="{% url 'schedule_management' %}"
class="{% block schedule_active %}{% endblock %}">
<i class="bi bi-calendar-week"></i>
Schedules
</a>

<a href="{% url 'rating_management' %}"
class="{% block rating_active %}{% endblock %}">
<i class="bi bi-star-fill"></i>
Ratings
</a>

<a href="{% url 'notification_management' %}"
class="{% block notification_active %}{% endblock %}">
<i class="bi bi-bell-fill"></i>
Notifications
</a>

<a href="{% url 'logout' %}">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>

</div>

<div class="main">

{% block content %}

{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}

{% endblock %}

</body>

</html>
