{% extends 'base.html' %}
{% load static %}

{% block content %}

<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px 20px;
">

    <div style="
        width:420px;
        background:white;
        border-radius:24px;
        padding:40px 35px;
        box-shadow:0 10px 30px rgba(0,0,0,0.08);
        text-align:center;
    ">

        <!-- PROFILE IMAGE -->

        <div style="
            width:110px;
            height:110px;
            margin:auto;
            border-radius:50%;
            background:#eef5ff;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:20px;
        ">

            <img 
                src="{% static 'images/profile2.png' %}"

                style="
                    width:70px;
                    height:70px;
                    object-fit:contain;
                "
            >

        </div>

        <!-- USERNAME -->

        <h2 style="
            margin-bottom:8px;
            color:#1e4fd8;
            font-size:30px;
            font-weight:700;
        ">
            {{ user.username }}
        </h2>

        <!-- INFO CARD -->

        <div style="
            background:#f7faff;
            border-radius:18px;
            padding:20px;
            margin-bottom:30px;
            text-align:left;
        ">

            <p style="margin-bottom:12px;">
                <b>Username:</b> {{ user.username }}
            </p>

            <p style="margin-bottom:0;">
                <b>Phone:</b> {{ profile.phone }}
            </p>

        </div>

        <!-- BUTTONS -->

        <div style="
            display:flex;
            gap:14px;
            justify-content:center;
        ">

            <a href="{% url 'edit_profile' %}"
               style="text-decoration:none;">

                <button style="
                    background:#1e4fd8;
                    color:white;
                    border:none;
                    padding:12px 24px;
                    border-radius:12px;
                    font-weight:600;
                    cursor:pointer;
                    font-size:15px;
                ">
                    Edit Profile
                </button>

            </a>

            <a href="{% url 'logout' %}"
               style="text-decoration:none;">

                <button style="
                    background:white;
                    color:#e63946;
                    border:2px solid #e63946;
                    padding:12px 24px;
                    border-radius:12px;
                    font-weight:600;
                    cursor:pointer;
                    font-size:15px;
                ">
                    Logout
                </button>

            </a>

        </div>

    </div>

</div>

{% endblock %}
