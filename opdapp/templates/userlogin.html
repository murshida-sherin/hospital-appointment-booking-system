
{% extends 'base.html' %}
{% block content %}

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap');

    .login-wrapper{
        min-height:85vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px 20px;
        font-family:'Manrope',sans-serif;
    }

    .login-card{
        width:100%;
        max-width:400px;
        background:white;
        border-radius:24px;
        padding:32px;
        box-shadow:0 10px 35px rgba(0,0,0,0.08);
    }

    .login-top{
        text-align:center;
        margin-bottom:28px;
    }

    .login-icon{
        width:72px;
        height:72px;
        background:#e8f1ff;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:auto;
        margin-bottom:18px;
    }

    .login-icon i{
        font-size:30px;
        color:#0d6efd;
    }

    .login-top h2{
        font-size:28px;
        margin-bottom:8px;
        color:#0f172a;
    }

    .login-top p{
        color:#64748b;
        font-size:14px;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:10px;
        font-weight:600;
        color:#1e293b;
        font-size:14px;
    }

    .input-box{
        position:relative;
    }

    .input-box i{
        position:absolute;
        left:15px;
        top:50%;
        transform:translateY(-50%);
        color:#64748b;
        font-size:15px;
    }

    .input-box input{
        width:100%;
        padding:13px 14px 13px 42px;
        border:1px solid #dbe2ea;
        border-radius:12px;
        font-size:14px;
        background:#f8fafc;
        transition:0.3s;
        font-family:'Manrope',sans-serif;
        box-sizing:border-box;
    }

    .input-box input:focus{
        outline:none;
        border-color:#0d6efd;
        background:white;
        box-shadow:0 0 0 4px rgba(13,110,253,0.08);
    }

    .login-btn{
        width:100%;
        border:none;
        padding:13px;
        border-radius:12px;
        background:linear-gradient(135deg,#0d6efd,#2563eb);
        color:white;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
        margin-top:5px;
        font-family:'Manrope',sans-serif;
    }

    .login-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 20px rgba(37,99,235,0.22);
    }

    .bottom-text{
        text-align:center;
        margin-top:24px;
        color:#64748b;
        font-size:14px;
    }

    .bottom-text a{
        color:#0d6efd;
        text-decoration:none;
        font-weight:600;
    }

    .alert-box{
        background:#fee2e2;
        color:#dc2626;
        padding:14px;
        border-radius:12px;
        margin-bottom:20px;
        text-align:center;
        font-weight:600;
        font-size:14px;
    }

</style>

<div class="login-wrapper">

    <div class="login-card">

        <div class="login-top">

            <div class="login-icon">
                <i class="bi bi-shield-lock"></i>
            </div>

            <h2>Welcome Back</h2>

            <p>
                Login to continue to your account
            </p>

        </div>

        {% if messages %}

            {% for message in messages %}

                <div class="alert-box">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <div class="input-box">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="input-box">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>

            </div>

            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>

        <div class="bottom-text">

            Don't have an account?

            <a href="/register/">
                Register
            </a>

        </div>

    </div>

</div>

{% endblock %}
